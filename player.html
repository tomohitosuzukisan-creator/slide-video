<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>slide-video player</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #player{position:absolute;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="player"></div>
<script>
  /*
   * HTMLスライド（パソコン上のファイル）から YouTube の公開動画を再生するための中継ページ。
   * YouTube は埋め込み元のサイトが分からない再生を断る（エラー153）ため、このページを経由する。
   * 映せる動画は下の一覧に固定（他の動画の中継には使えない）。
   * スライドからの指示（postMessage）：{ssmVideo:'play' | 'pause' | 'stop'}
   * スライドへの通知：{ssmVideoState:'ready' | 'playing' | 'paused' | 'ended'}
   */
  const VIDEOS = {
    'project-ace': 'FrGq8ltb-_E'   // Sony AI「Project Ace」（YouTube 公開動画・埋め込み許可あり）
  };
  const key = new URLSearchParams(location.search).get('v') || 'project-ace';
  const videoId = VIDEOS[key];
  const tell = state => parent !== window && parent.postMessage({ssmVideoState: state}, '*');
  let player;

  if (videoId) {
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('player', {
      videoId,
      playerVars: {rel: 0, playsinline: 1, modestbranding: 1, controls: 1},
      events: {
        onReady: () => tell('ready'),
        onStateChange: e => {
          if (e.data === YT.PlayerState.PLAYING) tell('playing');
          if (e.data === YT.PlayerState.PAUSED) tell('paused');
          if (e.data === YT.PlayerState.ENDED) tell('ended');
        }
      }
    });
  };
  window.addEventListener('message', e => {
    const cmd = e.data && e.data.ssmVideo;
    if (!player || !cmd) return;
    if (cmd === 'play') player.playVideo();
    if (cmd === 'pause') player.pauseVideo();
    if (cmd === 'stop') { player.pauseVideo(); player.seekTo(0, true); }
  });
</script>
</body>
</html>
